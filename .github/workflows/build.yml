name: Build

# Push to main:      unit tests + debug APK (uploaded as a workflow artifact). If the version in the VERSION file has no GitHub Release yet,
#                    a SIGNED release APK is built and published as Release v<VERSION> (the tag is created by GitHub at this commit).
#                    So a new release = change VERSION (e.g. 0.1.0 -> 0.1.1) and push to main.
# Push of tag v*:    unit tests, then a SIGNED release APK that is attached to a GitHub Release (rinkside-<version>.apk).
# workflow_dispatch: same as a push of the branch or tag it is started on.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  test:
    name: Unit tests and debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests and debug build
        run: ./gradlew --stacktrace testDebugUnitTest assembleDebug

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests
          if-no-files-found: ignore

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: rinkside-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  release:
    name: Signed release APK
    needs: test
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Check out
        uses: actions/checkout@v4

      # Which release this run makes: the pushed tag, or on main "v" + the VERSION file. On main nothing is done when that release already exists.
      - name: Decide the release
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="$GITHUB_REF_NAME"; MODE=tag
          else
            TAG="v$(tr -d ' \r\n' < VERSION)"; MODE=main
          fi
          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"
          echo "RELEASE_MODE=$MODE" >> "$GITHUB_ENV"
          if [ "$MODE" = main ] && gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG already exists; nothing to publish (change VERSION to make a new one)."
            echo "SKIP_RELEASE=true" >> "$GITHUB_ENV"
          else
            echo "SKIP_RELEASE=false" >> "$GITHUB_ENV"
            echo "Making release $TAG ($MODE)."
          fi

      # A release is only ever built with the real release key. Without all four secrets the job stops here, before anything is built or published.
      - name: Check signing secrets
        if: env.SKIP_RELEASE != 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=""
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ] && [ "$RELEASE_MODE" = main ]; then
            echo "::warning title=Signing secrets missing::No release was made because these repository secrets are missing:$missing. Add them under Settings > Secrets and variables > Actions and push again."
            echo "SKIP_RELEASE=true" >> "$GITHUB_ENV"
            exit 0
          fi
          if [ -n "$missing" ]; then
            echo "::error title=Signing secrets missing::These repository secrets are empty or missing:$missing. Add them under Settings > Secrets and variables > Actions, then run this workflow again. No release was built or published (an unsigned or debug-signed release is never published)."
            exit 1
          fi
          echo "All four signing secrets are present."

      - name: Work out the version from the tag
        if: env.SKIP_RELEASE != 'true'
        run: |
          TAG="${RELEASE_TAG}"
          VERSION="${TAG#v}"
          re='^([0-9]+)\.([0-9]+)\.([0-9]+)([-+].*)?$'
          if ! [[ "$VERSION" =~ $re ]]; then
            echo "::error title=Bad tag::The tag '$TAG' is not of the form vMAJOR.MINOR.PATCH (for example v0.1.0 or v0.2.0-beta1)."
            exit 1
          fi
          MAJOR=$((10#${BASH_REMATCH[1]})); MINOR=$((10#${BASH_REMATCH[2]})); PATCH=$((10#${BASH_REMATCH[3]}))
          if [ "$MAJOR" -ge 2000 ] || [ "$MINOR" -ge 1000 ] || [ "$PATCH" -ge 1000 ]; then
            echo "::error title=Bad tag::MAJOR must be below 2000 and MINOR and PATCH below 1000."
            exit 1
          fi
          CODE=$((MAJOR * 1000000 + MINOR * 1000 + PATCH))
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$CODE" >> "$GITHUB_ENV"
          echo "Version $VERSION, versionCode $CODE"

      - name: Set up JDK 17
        if: env.SKIP_RELEASE != 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        if: env.SKIP_RELEASE != 'true'
        uses: gradle/actions/setup-gradle@v4

      - name: Decode the keystore
        if: env.SKIP_RELEASE != 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          KEYSTORE="$RUNNER_TEMP/rinkside-release.jks"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$KEYSTORE"
          if ! keytool -list -keystore "$KEYSTORE" -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" > /dev/null; then
            echo "::error title=Keystore problem::The keystore could not be opened with ANDROID_KEYSTORE_PASSWORD and ANDROID_KEY_ALIAS. Check the four secrets against the README.txt that was kept together with the keystore file."
            exit 1
          fi
          echo "ANDROID_KEYSTORE_PATH=$KEYSTORE" >> "$GITHUB_ENV"

      - name: Unit tests
        if: env.SKIP_RELEASE != 'true'
        run: ./gradlew --stacktrace testReleaseUnitTest

      - name: Build the signed release APK
        if: env.SKIP_RELEASE != 'true'
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --stacktrace assembleRelease -PversionName="$VERSION" -PversionCode="$VERSION_CODE"

      - name: Verify that the APK is signed with the release key
        if: env.SKIP_RELEASE != 'true'
        run: |
          APK="$(ls app/build/outputs/apk/release/*.apk | head -n 1)"
          case "$APK" in
            *unsigned*) echo "::error title=Unsigned APK::The release build produced an unsigned APK ($APK). Nothing is published."; exit 1 ;;
          esac
          APKSIGNER="$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee "$RUNNER_TEMP/apksigner.txt"
          if grep -qi "Android Debug" "$RUNNER_TEMP/apksigner.txt"; then
            echo "::error title=Debug-signed APK::The APK carries the Android debug certificate. Nothing is published."
            exit 1
          fi
          cp "$APK" "rinkside-${VERSION}.apk"
          ls -l "rinkside-${VERSION}.apk"

      - name: Create the GitHub Release
        if: env.SKIP_RELEASE != 'true'
        run: |
          APK="rinkside-${VERSION}.apk"
          flags=()
          case "$VERSION" in
            *-*) flags+=(--prerelease) ;;
          esac
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$APK" --clobber
          elif [ "$RELEASE_MODE" = tag ]; then
            gh release create "$RELEASE_TAG" "$APK" --title "$RELEASE_TAG" --generate-notes --verify-tag "${flags[@]}"
          else
            gh release create "$RELEASE_TAG" "$APK" --title "$RELEASE_TAG" --generate-notes --target "$GITHUB_SHA" "${flags[@]}"
          fi
